<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog de Manutenção</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #f3f5f9;
    --card: #ffffff;
    --border: #e1e5ed;
    --text: #1c2230;
    --muted: #667085;
    --accent: #ff6b57;
    --media-bg: #e9ecf2;

    --status-nao-iniciado: #757575;
    --status-planejado: #579bfc;
    --status-em-andamento: #fdab3d;
    --status-pendente: #df2f4a;
    --status-concluido: #00c875;

    --prio-baixa: #579bfc;
    --prio-media: #fdab3d;
    --prio-alta: #df2f4a;

    --tipo-preventiva: #00c875;
    --tipo-corretiva: #df2f4a;
    --tipo-preditiva: #579bfc;
    --tipo-melhoria: #fdab3d;

    --dep-mecanica: #00c875;
    --dep-eletrica: #007eb5;
    --dep-automacao: #9d50dd;
    --dep-pcm: #784bd1;
    --dep-civil: #7f5347;
    --dep-utilidades: #ff6d3b;
    --dep-producao: #175a63;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  header {
    padding: 28px 40px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
  header .subtitle { color: var(--muted); font-size: 14px; }
  header .subtitle a { color: var(--accent); text-decoration: underline; }

  .counters { display: flex; gap: 36px; }
  .counter { text-align: center; }
  .counter .num { font-size: 26px; font-weight: 800; line-height: 1; }
  .counter .label { font-size: 11px; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
  .counter.urgente .num { color: var(--status-pendente); }
  .counter.andamento .num { color: var(--status-em-andamento); }
  .counter.backlog .num { color: #5f6879; }
  .counter.concluido .num { color: var(--status-concluido); }

  .filters {
    padding: 18px 40px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .filter-group .filter-title {
    font-size: 11px; letter-spacing: 0.04em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 8px;
  }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #1a0f0c; font-weight: 700; }

  .search-box { margin-left: auto; }
  .search-box input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 260px;
  }

  main { padding: 24px 40px 60px; }

  .group-header { display: flex; align-items: center; gap: 10px; margin: 30px 0 14px; }
  .group-header:first-child { margin-top: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .group-header h2 { font-size: 17px; margin: 0; }
  .group-header .count { color: var(--muted); font-size: 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 30, 50, 0.07); }

  /* ---------- Mídia do card (foto única ou carrossel) ---------- */
  .media { position: relative; height: 170px; background: var(--media-bg); }
  .media.placeholder { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }

  .track {
    display: flex;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }

  .slide {
    position: relative;
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    background: var(--media-bg);
  }
  .slide img, .slide video { width: 100%; height: 100%; display: block; }
  .slide img { object-fit: cover; cursor: zoom-in; }
  .slide video { object-fit: contain; background: #000; }
  .slide .broken {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; background: var(--media-bg); text-align: center; padding: 10px;
  }
  .slide.failed .broken { display: flex; }
  .slide.failed img, .slide.failed video { visibility: hidden; }

  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    background: rgba(11, 14, 20, 0.62); color: #fff;
    font-size: 20px; line-height: 32px; text-align: center;
    opacity: 0; transition: opacity 0.15s, background 0.15s;
    z-index: 2;
  }
  .nav:hover { background: rgba(255, 107, 87, 0.9); }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }
  .media:hover .nav, .nav:focus-visible { opacity: 1; }
  @media (hover: none) { .nav { opacity: 0.85; width: 28px; height: 28px; line-height: 28px; font-size: 18px; } }

  .badge {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(11, 14, 20, 0.7); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    padding: 3px 8px; border-radius: 999px; pointer-events: none;
  }

  .dots {
    position: absolute; left: 0; right: 0; bottom: 8px; z-index: 2;
    display: flex; justify-content: center; gap: 6px; pointer-events: none;
  }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s, background 0.15s;
  }
  .dots i.on { background: #fff; transform: scale(1.35); }

  .card .card-body { padding: 16px; }
  .card .atividade { font-weight: 700; font-size: 15px; margin-bottom: 10px; line-height: 1.3; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag.tag-os { background: #1f2937; color: #fff; letter-spacing: .3px; }
  .tag.tag-noos { background: transparent; color: var(--muted); border: 1px dashed var(--muted); font-weight: 600; }
  .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 5px; font-weight: 700; color: #0b0e14; }
  .tag.plain { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 500; }

  .card-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px;
  }
  .card-footer .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
  footer.warn { color: #b26a00; }

  /* ---------- Esqueleto de carregamento ---------- */
  .skel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .skel .s-media { height: 170px; }
  .skel .s-line { height: 12px; border-radius: 6px; margin: 14px 16px 0; }
  .skel .s-line.short { width: 45%; margin-bottom: 18px; }
  .skel .s-media, .skel .s-line {
    background: linear-gradient(90deg, #eceff5 25%, #f7f8fb 37%, #eceff5 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  /* ---------- Ampliar foto ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(6, 8, 12, 0.94);
    display: none; align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb-stage { max-width: 92vw; max-height: 88vh; display: flex; }
  .lb-stage img, .lb-stage video { max-width: 92vw; max-height: 88vh; border-radius: 6px; background: #000; }
  .lb-btn {
    position: absolute; border: 0; cursor: pointer; color: #fff;
    background: rgba(255, 255, 255, 0.12); border-radius: 50%;
    width: 44px; height: 44px; font-size: 26px; line-height: 44px; text-align: center; padding: 0;
  }
  .lb-btn:hover { background: var(--accent); }
  .lb-close { top: 18px; right: 18px; font-size: 22px; }
  .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
  .lb-count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #cfd3db; font-size: 13px; }

  @media (max-width: 700px) {
    header, .filters, main { padding-left: 16px; padding-right: 16px; }
    .counters { gap: 22px; }
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Backlog de Manutenção</h1>
    <div class="subtitle">
      PCM · Goiás Verde —
      <a href="https://messigean18s-team.monday.com/boards/18430494778" target="_blank" rel="noopener">abrir board no Monday</a>
    </div>
  </div>
  <div class="counters">
    <div class="counter urgente"><div class="num" id="count-urgente">0</div><div class="label">Urgente</div></div>
    <div class="counter andamento"><div class="num" id="count-andamento">0</div><div class="label">Em andamento</div></div>
    <div class="counter backlog"><div class="num" id="count-backlog">0</div><div class="label">Backlog</div></div>
    <div class="counter concluido"><div class="num" id="count-concluido">0</div><div class="label">Concluído</div></div>
  </div>
</header>

<div class="filters">
  <div class="filter-group">
    <div class="filter-title">Status</div>
    <div class="chip-row" id="status-filters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-title">Prioridade</div>
    <div class="chip-row" id="prioridade-filters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-title">Departamento</div>
    <div class="chip-row" id="departamento-filters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-title">Tipo de Manutenção</div>
    <div class="chip-row" id="tipo-filters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-title">Ordem de Serviço (OS)</div>
    <div class="chip-row" id="os-filters"></div>
  </div>
  <div class="filter-group search-box">
    <div class="filter-title">Buscar</div>
    <input type="text" id="search-input" placeholder="equipamento, local, atividade, nº da OS...">
  </div>
</div>

<!-- O esqueleto aparece na hora, antes mesmo dos dados chegarem do Monday -->
<main id="main-content">
  <div class="cards">
    <div class="skel"><div class="s-media"></div><div class="s-line"></div><div class="s-line short"></div></div>
    <div class="skel"><div class="s-media"></div><div class="s-line"></div><div class="s-line short"></div></div>
    <div class="skel"><div class="s-media"></div><div class="s-line"></div><div class="s-line short"></div></div>
    <div class="skel"><div class="s-media"></div><div class="s-line"></div><div class="s-line short"></div></div>
  </div>
</main>

<footer id="footer-updated"></footer>

<div class="lb" id="lb" aria-hidden="true">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Fechar">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Anterior">‹</button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Próxima">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<script>
// O painel pergunta ao NOSSO servidor se algo mudou (isso não consulta o Monday).
// O servidor só vai ao Monday quando o Monday avisa que houve mudança.
const REFRESH_MS = 20000;
const FETCH_TIMEOUT_MS = 20000;
const URL_TTL_MS = 25 * 60 * 1000; // os links de foto do Monday expiram em 1 h; troca antes disso (idade contada desde que o servidor os gerou)

const STATUS_COLORS = {
  "Não Iniciado": "var(--status-nao-iniciado)",
  "Planejado": "var(--status-planejado)",
  "Em Andamento": "var(--status-em-andamento)",
  "Pendente": "var(--status-pendente)",
  "Concluído": "var(--status-concluido)",
};
const PRIORIDADE_COLORS = {
  "Baixa": "var(--prio-baixa)",
  "Média": "var(--prio-media)",
  "Alta": "var(--prio-alta)",
};
const TIPO_COLORS = {
  "Preventiva": "var(--tipo-preventiva)",
  "Corretiva": "var(--tipo-corretiva)",
  "Preditiva": "var(--tipo-preditiva)",
  "Melhoria": "var(--tipo-melhoria)",
};
const DEP_COLORS = {
  "Mecânica": "var(--dep-mecanica)",
  "Elétrica": "var(--dep-eletrica)",
  "Automação": "var(--dep-automacao)",
  "PCM": "var(--dep-pcm)",
  "Civil": "var(--dep-civil)",
  "Utilidades": "var(--dep-utilidades)",
  "Produção": "var(--dep-producao)",
};
const DOT_COLORS = {
  topics: "var(--status-pendente)",
  group_mm72db89: "var(--status-em-andamento)",
  group_mm7217sw: "#9aa3b2",
  group_mm7298xt: "var(--status-concluido)",
};

let allData = null;
let lastSignature = "";
let currentVersion = "";
let activeStatus = null;
let activePrioridade = null;
let activeDepartamento = null;
let activeTipo = null;
let activeOs = null;

const urlCache = new Map();   // id da mídia -> { url, ts }  (mantém o mesmo link enquanto vale; o navegador reaproveita o cache)
const slideIndex = new Map(); // id do item -> slide atual do carrossel (não perde a posição ao atualizar)
const itemById = new Map();

const $main = document.getElementById("main-content");
const $footer = document.getElementById("footer-updated");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(iso) {
  if (!iso) return "sem data";
  const parts = iso.split("-");
  if (parts.length !== 3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function fmtTime(d) {
  return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

/* ---------- Dados ---------- */

function mediaKey(f) {
  return f.id ? String(f.id) : String(f.url || "").split("?")[0];
}

// Mantém o link antigo de cada foto enquanto ele ainda vale. Assim, quando o painel
// atualiza, o navegador não baixa tudo de novo (o link assinado muda a cada consulta).
function stabilizeUrls(data) {
  const now = Date.now();
  const madeAt = Date.parse(data.generated_at) || now; // quando o servidor gerou estes links
  data.groups.forEach(g => g.items.forEach(item => {
    (item.fotos || []).forEach(f => {
      f.key = mediaKey(f);
      const cached = urlCache.get(f.key);
      if (cached && now - cached.ts < URL_TTL_MS) {
        f.url = cached.url;
      } else {
        urlCache.set(f.key, { url: f.url, ts: madeAt });
      }
    });
  }));
}

// "Impressão digital" do que aparece na tela (ignora os links assinados, que sempre mudam).
function signature(data) {
  return JSON.stringify(data.groups.map(g => [
    g.id, g.title,
    g.items.map(i => [
      i.id, i.atividade, i.departamento, i.equipamento_local, i.tipo_manutencao,
      i.prioridade, i.status, i.responsavel, i.prazo, i.os,
      (i.fotos || []).map(f => f.key + ":" + f.tipo),
    ]),
  ]));
}

async function fetchData() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    // Com "v", o servidor responde só {unchanged:true} quando nada mudou (resposta minúscula).
    const url = "/api/data" + (currentVersion ? "?v=" + encodeURIComponent(currentVersion) : "");
    const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.unchanged) return data;
    if (!data.groups) throw new Error(data.error || "resposta inesperada");
    return data;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- Mídia do card ---------- */

function mediaSrc(f) {
  const cur = urlCache.get(f.key);
  return cur ? cur.url : f.url;
}

function slideHtml(f, n, total) {
  const key = esc(f.key);
  if (f.tipo === "video") {
    // O vídeo só começa a carregar quando o card chega perto da tela (ver observer). "#t=0.1" mostra o 1º quadro.
    return `<div class="slide"><video data-src="${esc(mediaSrc(f))}#t=0.1" data-key="${key}" controls playsinline preload="none"></video><div class="broken">Vídeo indisponível</div></div>`;
  }
  return `<div class="slide"><img src="${esc(mediaSrc(f))}" data-key="${key}" alt="Foto ${n} de ${total}" loading="lazy" decoding="async"><div class="broken">Foto indisponível</div></div>`;
}

function mediaHtml(item) {
  const fotos = item.fotos || [];
  if (fotos.length === 0) return `<div class="media placeholder">sem foto</div>`;
  const slides = fotos.map((f, i) => slideHtml(f, i + 1, fotos.length)).join("");
  if (fotos.length === 1) {
    return `<div class="media" data-item="${esc(item.id)}"><div class="track">${slides}</div></div>`;
  }
  const dots = fotos.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("");
  return `<div class="media multi" data-item="${esc(item.id)}">
    <div class="track">${slides}</div>
    <button class="nav prev" aria-label="Anterior" data-dir="-1">‹</button>
    <button class="nav next" aria-label="Próxima" data-dir="1">›</button>
    <div class="badge">1/${fotos.length}</div>
    <div class="dots">${dots}</div>
  </div>`;
}

// Carrega os vídeos só quando o card se aproxima da área visível.
const videoObserver = "IntersectionObserver" in window
  ? new IntersectionObserver(entries => {
      entries.forEach(e => {
        // ratio > 0: o slide vizinho encostando na borda do carrossel não conta como "visível"
        if (!e.isIntersecting || e.intersectionRatio === 0) return;
        const v = e.target;
        videoObserver.unobserve(v);
        if (!v.getAttribute("src")) { v.preload = "metadata"; v.src = v.dataset.src; }
      });
    }, { rootMargin: "300px", threshold: [0, 0.01] })
  : null;

function initMedia(root) {
  root.querySelectorAll("video[data-src]").forEach(v => {
    if (videoObserver) videoObserver.observe(v);
    else { v.preload = "metadata"; v.src = v.dataset.src; }
  });
  // volta cada carrossel para o slide em que estava
  root.querySelectorAll(".media.multi").forEach(m => {
    const idx = slideIndex.get(m.dataset.item);
    if (idx) {
      const track = m.querySelector(".track");
      track.scrollLeft = idx * track.clientWidth;
      updateCarouselUi(m, idx);
    }
  });
}

function updateCarouselUi(media, idx) {
  const dots = media.querySelectorAll(".dots i");
  dots.forEach((d, i) => d.classList.toggle("on", i === idx));
  const badge = media.querySelector(".badge");
  if (badge) badge.textContent = `${idx + 1}/${dots.length}`;
}

function goTo(media, idx, smooth) {
  const track = media.querySelector(".track");
  track.scrollTo({ left: idx * track.clientWidth, behavior: smooth ? "smooth" : "auto" });
}

// Rolagem do carrossel (o evento "scroll" não borbulha; por isso usamos a fase de captura)
let scrollRaf = 0;
$main.addEventListener("scroll", ev => {
  const track = ev.target;
  if (!track.classList || !track.classList.contains("track")) return;
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => {
    const media = track.parentElement;
    if (!media.classList.contains("multi")) return;
    const idx = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
    if (slideIndex.get(media.dataset.item) === idx) return;
    slideIndex.set(media.dataset.item, idx);
    updateCarouselUi(media, idx);
    // pausa o vídeo dos slides que saíram da tela
    track.querySelectorAll(".slide").forEach((s, i) => {
      if (i !== idx) s.querySelectorAll("video").forEach(v => v.pause());
    });
  });
}, true);

// Link expirado ou falha de rede: tenta uma vez com o link mais novo; senão mostra aviso.
$main.addEventListener("error", ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.key || !/^(IMG|VIDEO)$/.test(el.tagName)) return;
  if (el.tagName === "VIDEO" && !el.getAttribute("src")) return;
  const cur = urlCache.get(el.dataset.key);
  const wanted = cur ? cur.url + (el.tagName === "VIDEO" ? "#t=0.1" : "") : "";
  if (wanted && el.dataset.tried !== wanted && el.getAttribute("src") !== wanted) {
    el.dataset.tried = wanted;
    el.src = wanted;
  } else {
    el.closest(".slide").classList.add("failed");
  }
}, true);

// Se o painel ficou aberto por muito tempo, troca o link das mídias que ainda não carregaram.
function refreshPendingMedia() {
  $main.querySelectorAll("img[data-key]").forEach(img => {
    const cur = urlCache.get(img.dataset.key);
    if (cur && img.getAttribute("src") !== cur.url && (!img.complete || img.naturalWidth === 0)) img.src = cur.url;
  });
  $main.querySelectorAll("video[data-key]").forEach(v => {
    const cur = urlCache.get(v.dataset.key);
    if (!cur) return;
    const wanted = cur.url + "#t=0.1";
    if (v.dataset.src !== wanted) {
      v.dataset.src = wanted;
      if (v.getAttribute("src") && v.readyState === 0 && v.paused) v.src = wanted;
    }
  });
}

/* ---------- Cliques: setas, bolinhas e ampliar foto ---------- */

$main.addEventListener("click", ev => {
  const nav = ev.target.closest(".nav");
  if (nav) {
    const media = nav.closest(".media");
    const total = media.querySelectorAll(".slide").length;
    const cur = slideIndex.get(media.dataset.item) || 0;
    const next = (cur + Number(nav.dataset.dir) + total) % total; // volta ao início depois da última
    goTo(media, next, true);
    return;
  }
  const img = ev.target.closest(".slide img");
  if (img) {
    const media = img.closest(".media");
    const slideNo = Array.from(media.querySelectorAll(".slide")).indexOf(img.closest(".slide"));
    openLightbox(media.dataset.item, Math.max(slideNo, 0));
  }
});

const $lb = document.getElementById("lb");
const $lbStage = document.getElementById("lb-stage");
const $lbCount = document.getElementById("lb-count");
let lbItem = null;
let lbIdx = 0;

function renderLightbox() {
  const fotos = lbItem.fotos || [];
  const f = fotos[lbIdx];
  const src = esc(mediaSrc(f));
  $lbStage.innerHTML = f.tipo === "video"
    ? `<video src="${src}" controls autoplay playsinline></video>`
    : `<img src="${src}" alt="">`;
  $lbCount.textContent = `${esc(lbItem.atividade)} — ${lbIdx + 1}/${fotos.length}`;
  const many = fotos.length > 1;
  document.getElementById("lb-prev").style.display = many ? "" : "none";
  document.getElementById("lb-next").style.display = many ? "" : "none";
}

function openLightbox(itemId, idx) {
  lbItem = itemById.get(String(itemId));
  if (!lbItem) return;
  lbIdx = idx;
  renderLightbox();
  $lb.classList.add("open");
  $lb.setAttribute("aria-hidden", "false");
}

function closeLightbox() {
  $lb.classList.remove("open");
  $lb.setAttribute("aria-hidden", "true");
  $lbStage.innerHTML = "";
  lbItem = null;
}

function stepLightbox(dir) {
  if (!lbItem) return;
  const n = (lbItem.fotos || []).length;
  lbIdx = (lbIdx + dir + n) % n;
  renderLightbox();
}

document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-prev").addEventListener("click", () => stepLightbox(-1));
document.getElementById("lb-next").addEventListener("click", () => stepLightbox(1));
$lb.addEventListener("click", ev => { if (ev.target === $lb || ev.target === $lbStage) closeLightbox(); });
document.addEventListener("keydown", ev => {
  if (!lbItem) return;
  if (ev.key === "Escape") closeLightbox();
  else if (ev.key === "ArrowLeft") stepLightbox(-1);
  else if (ev.key === "ArrowRight") stepLightbox(1);
});
let touchX = null;
$lb.addEventListener("touchstart", ev => { touchX = ev.touches[0].clientX; }, { passive: true });
$lb.addEventListener("touchend", ev => {
  if (touchX === null) return;
  const dx = ev.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) stepLightbox(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- Filtros ---------- */

function buildChips(containerId, values, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  values.forEach(v => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = v;
    chip.addEventListener("click", () => onSelect(v, chip));
    container.appendChild(chip);
  });
}

function selectChip(container, chipEl, current, value) {
  container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  if (current === value) return null;
  chipEl.classList.add("active");
  return value;
}

/* ---------- Desenho da tela ---------- */

function cardHtml(item) {
  const statusColor = STATUS_COLORS[item.status] || "var(--muted)";
  const prioColor = PRIORIDADE_COLORS[item.prioridade] || "var(--muted)";
  const tipoColor = TIPO_COLORS[item.tipo_manutencao] || "var(--muted)";
  const depColor = DEP_COLORS[item.departamento] || "var(--muted)";
  return `
    <div class="card">
      ${mediaHtml(item)}
      <div class="card-body">
        <div class="atividade">${esc(item.atividade)}</div>
        <div class="tags">
          ${item.status ? `<span class="tag" style="background:${statusColor}">${esc(item.status)}</span>` : ""}
          ${item.prioridade ? `<span class="tag" style="background:${prioColor}">${esc(item.prioridade)}</span>` : ""}
          ${item.departamento ? `<span class="tag" style="background:${depColor}">${esc(item.departamento)}</span>` : ""}
          ${item.tipo_manutencao ? `<span class="tag" style="background:${tipoColor}">${esc(item.tipo_manutencao)}</span>` : ""}
          ${item.os ? `<span class="tag tag-os">OS ${esc(item.os)}</span>` : `<span class="tag tag-noos">Sem OS</span>`}
        </div>
        <div class="card-footer">
          <div>
            <div>${item.equipamento_local ? esc(item.equipamento_local) : "sem equipamento/local"}</div>
            <div class="sub">${item.responsavel ? esc(item.responsavel) : "sem responsável"}</div>
          </div>
          <div>${fmtDate(item.prazo)}</div>
        </div>
      </div>
    </div>`;
}

function render() {
  if (!allData) return;
  const search = document.getElementById("search-input").value.trim().toLowerCase();
  const counters = { topics: 0, group_mm72db89: 0, group_mm7217sw: 0, group_mm7298xt: 0 };
  let html = "";
  let total = 0;

  itemById.clear();
  allData.groups.forEach(g => g.items.forEach(i => itemById.set(String(i.id), i)));

  allData.groups.forEach(group => {
    const filtered = group.items.filter(item => {
      if (activeStatus && item.status !== activeStatus) return false;
      if (activePrioridade && item.prioridade !== activePrioridade) return false;
      if (activeDepartamento && item.departamento !== activeDepartamento) return false;
      if (activeTipo && item.tipo_manutencao !== activeTipo) return false;
      if (activeOs === "Com OS" && !item.os) return false;
      if (activeOs === "Sem OS" && item.os) return false;
      if (search) {
        const haystack = `${item.atividade} ${item.equipamento_local} ${item.responsavel} ${item.os || ""}`.toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    if (group.id in counters) counters[group.id] = filtered.length;
    total += filtered.length;

    html += `
      <div class="group-header">
        <div class="dot" style="background:${DOT_COLORS[group.id] || "#666"}"></div>
        <h2>${esc(group.title)}</h2>
        <span class="count">(${filtered.length})</span>
      </div>`;
    html += filtered.length === 0
      ? `<div class="empty-state">Nenhuma atividade neste grupo com os filtros atuais.</div>`
      : `<div class="cards">${filtered.map(cardHtml).join("")}</div>`;
  });

  // mantém a rolagem da página onde estava
  const y = window.scrollY;
  $main.innerHTML = total === 0
    ? '<div class="empty-state">Nenhuma atividade encontrada com os filtros atuais.</div>'
    : html;
  initMedia($main);
  window.scrollTo(0, y);

  document.getElementById("count-urgente").textContent = counters.topics;
  document.getElementById("count-andamento").textContent = counters.group_mm72db89;
  document.getElementById("count-backlog").textContent = counters.group_mm7217sw;
  document.getElementById("count-concluido").textContent = counters.group_mm7298xt;
}

/* ---------- Atualização automática ---------- */

function setFooter(text, warn) {
  $footer.textContent = text;
  $footer.classList.toggle("warn", !!warn);
}

let lastOkAt = null;
let dataTime = null;   // quando o servidor buscou os dados no Monday
let refreshing = false;

async function refresh(first) {
  if (refreshing) return;
  refreshing = true;
  try {
    const data = await fetchData();
    lastOkAt = new Date();

    if (data.unchanged) {
      // Nada mudou no Monday: não redesenha nada.
      refreshPendingMedia();
    } else {
      stabilizeUrls(data);
      const sig = signature(data);
      allData = data;
      currentVersion = data.version || "";
      dataTime = new Date(data.generated_at || Date.now());
      if (sig !== lastSignature) {
        lastSignature = sig;
        render();          // só redesenha quando algo mudou de verdade (sem piscar)
      } else {
        refreshPendingMedia();
      }
      if (data.stale) {
        setFooter(`Monday indisponível no momento — mostrando dados de ${fmtTime(dataTime)}`, true);
        return;
      }
    }
    setFooter(`Dados de ${fmtTime(dataTime || lastOkAt)} · atualiza sozinho quando algo muda no Monday`, false);
  } catch (e) {
    if (first && !allData) {
      $main.innerHTML = '<div class="empty-state">Não foi possível carregar os dados. Verifique se o token do Monday está configurado no Vercel (MONDAY_API_TOKEN).</div>';
    } else if (lastOkAt) {
      setFooter(`Sem conexão com o servidor — mostrando dados de ${fmtTime(dataTime || lastOkAt)}`, true);
    }
  } finally {
    refreshing = false;
  }
}

function init() {
  buildChips("status-filters", ["Não Iniciado", "Planejado", "Em Andamento", "Pendente", "Concluído"], (v, el) => {
    activeStatus = selectChip(document.getElementById("status-filters"), el, activeStatus, v);
    render();
  });
  buildChips("prioridade-filters", ["Baixa", "Média", "Alta"], (v, el) => {
    activePrioridade = selectChip(document.getElementById("prioridade-filters"), el, activePrioridade, v);
    render();
  });
  buildChips("departamento-filters", ["Mecânica", "Elétrica", "Automação", "PCM", "Civil", "Utilidades", "Produção"], (v, el) => {
    activeDepartamento = selectChip(document.getElementById("departamento-filters"), el, activeDepartamento, v);
    render();
  });
  buildChips("tipo-filters", ["Preventiva", "Corretiva", "Preditiva", "Melhoria"], (v, el) => {
    activeTipo = selectChip(document.getElementById("tipo-filters"), el, activeTipo, v);
    render();
  });
  buildChips("os-filters", ["Com OS", "Sem OS"], (v, el) => {
    activeOs = selectChip(document.getElementById("os-filters"), el, activeOs, v);
    render();
  });
  document.getElementById("search-input").addEventListener("input", render);

  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, REFRESH_MS);
  // ao voltar para a aba, atualiza na hora
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
}

init();
</script>
